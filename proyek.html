<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Proyek - Pohonin</title>
    <script src="js/auth.js"></script>
</head>

<body class="beranda" data-wajib-login="true">
    <header class="header-utama">
        <div class="wadah header-isi">
            <a href="beranda.html" class="merek">
                <span class="merek-logo"><img src="image/logo.svg" alt="Logo Pohonin"></span>
                <span class="merek-nama">Pohonin</span>
            </a>
            <nav class="menu">
                <a href="beranda.html">Beranda</a>
                <a href="proyek.html" class="aktif">Proyek</a>
                <a href="#">Peta</a>
                <a href="before&after.html">Tentang</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="wadah">
                <div class="hero-isi">
                    <h1><span>Semua Proyek Reboisasi</span></h1>
                </div>
            </div>
        </section>

        <div class="kolom mt-5 row justify-content-center g-2 m-5">
            <div class="col-md-4">
                <input type="text" id="cariProyek" class="form-control" placeholder="Cari Proyek">
            </div>
            <div class="col-md-4">
                <select id="filterLokasi" class="form-select">
                    <option value="">Semua Lokasi</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="filterStatus" class="form-select">
                    <option value="">Semua Status</option>
                    <option value="Konservasi Aktif">Konservasi Aktif</option>
                    <option value="Hampir Selesai">Hampir Selesai</option>
                </select>
            </div>
        </div>

        <section class="proyek" id="proyek">
            <div class="wadah">
                <div class="proyek-grid" id="daftarProyek"></div>
                <p id="kosong" class="kosong" hidden>Tidak ada proyek yang cocok.</p>
            </div>
        </section>
    </main>

    <script src="js/proyek.js"></script>
</body>
</html>
